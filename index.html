<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precifica</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7A5C42" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Manrope', system-ui, sans-serif; }

      @keyframes app-spin { to { transform: rotate(360deg); } }
      .app-spinner { display: inline-block; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; opacity: 0.6; animation: app-spin .6s linear infinite; flex-shrink: 0; }

      .app-menu-btn { display: none; }
      .app-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,15,20,.42); z-index: 65; }
      .materials-card-view { display: none; }
      .quotes-card-view { display: none; }
      .admin-users-card-view { display: none; }
      .mobile-only-actions { display: none; }

      @media (max-width: 640px) {
        .materials-table-view { display: none !important; }
        .materials-card-view { display: flex !important; }
        .quotes-table-view { display: none !important; }
        .quotes-card-view { display: flex !important; }
        .admin-users-table-view { display: none !important; }
        .admin-users-card-view { display: flex !important; }
        .toolbar-field { max-width: none !important; flex: 1 1 100% !important; }
        .products-new-btn { width: 100% !important; justify-content: center !important; }
        .desktop-only-actions { display: none !important; }
        .mobile-only-actions { display: flex !important; }
      }

      @media (max-width: 900px) {
        .app-sidebar {
          position: fixed !important;
          top: 0; left: 0; bottom: 0;
          transform: translateX(-100%);
          transition: transform .22s ease;
          box-shadow: 10px 0 30px rgba(0,0,0,.18);
          z-index: 70;
        }
        .app-sidebar.open { transform: translateX(0); }
        .app-menu-btn { display: inline-flex !important; }
        .app-backdrop.open { display: block; }
        .app-content { padding-left: 20px !important; padding-right: 20px !important; }
        .app-topbar { padding-left: 14px !important; padding-right: 20px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
